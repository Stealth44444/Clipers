name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from packageManager in package.json; naming it here too fails the step.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Supabase realtime-js needs the native WebSocket that Node 22 has (Vercel and local use 22 too).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm turbo run test
      # The site prerenders campaign pages from Supabase, so the build needs the public URL and key.
      - run: pnpm turbo run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
