name: YouTube view snapshots

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request view snapshot sync
        env:
          APP_URL: ${{ secrets.CLIPERS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Configure CLIPERS_APP_URL and CRON_SECRET repository secrets to enable sync."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/youtube-views"